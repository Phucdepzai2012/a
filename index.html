<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Video Player</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#0b0d12;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    width:min(1000px,94%);
    margin:40px auto;
}

.box{
    background:#151922;
    border:1px solid #292f3a;
    border-radius:22px;
    padding:25px;
}

h1{
    text-align:center;
    margin:0 0 8px;
}

.desc{
    text-align:center;
    color:#9da5b2;
    margin-bottom:25px;
}

.form{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:16px;
    border-radius:12px;
    border:1px solid #343b48;
    background:#0b0e13;
    color:white;
    font-size:16px;
    outline:none;
}

button{
    padding:0 25px;
    border:0;
    border-radius:12px;
    background:#ff0033;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.player{
    margin-top:25px;
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:18px;
    overflow:hidden;
}

.player iframe{
    width:100%;
    height:100%;
    border:0;
}

.message{
    display:none;
    margin-top:18px;
    padding:15px;
    background:#0d1016;
    border-radius:12px;
    color:#b9c1cc;
    line-height:1.5;
}

@media(max-width:650px){
    .form{
        flex-direction:column;
    }

    button{
        padding:15px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<h1>🎬 My Video Player</h1>

<div class="desc">
Dán link YouTube để phát video ngay trên trang
</div>

<div class="form">

<input
    id="url"
    type="text"
    placeholder="https://www.youtube.com/watch?v=..."
>

<button onclick="playVideo()">
    PHÁT
</button>

</div>

<div class="player" id="player"></div>

<div class="message" id="message"></div>

</div>

</div>


<script>

function getYouTubeID(url){

    try{

        const u = new URL(url);

        // youtube.com/watch?v=
        if(
            u.hostname === "youtube.com" ||
            u.hostname === "www.youtube.com"
        ){

            const v = u.searchParams.get("v");

            if(v) return v;

            // /shorts/VIDEO_ID
            if(u.pathname.startsWith("/shorts/")){
                return u.pathname
                    .split("/shorts/")[1]
                    .split("/")[0];
            }

            // /live/VIDEO_ID
            if(u.pathname.startsWith("/live/")){
                return u.pathname
                    .split("/live/")[1]
                    .split("/")[0];
            }

            // /embed/VIDEO_ID
            if(u.pathname.startsWith("/embed/")){
                return u.pathname
                    .split("/embed/")[1]
                    .split("/")[0];
            }
        }

        // youtu.be/VIDEO_ID
        if(
            u.hostname === "youtu.be" ||
            u.hostname === "www.youtu.be"
        ){
            return u.pathname
                .substring(1)
                .split("/")[0];
        }

    }catch(e){}

    return null;
}


function playVideo(){

    const url =
        document.getElementById("url").value.trim();

    const player =
        document.getElementById("player");

    const message =
        document.getElementById("message");

    message.style.display = "none";
    message.innerHTML = "";

    if(!url){

        message.style.display = "block";
        message.innerHTML =
            "Hãy dán link YouTube.";

        return;
    }

    const id = getYouTubeID(url);

    if(!id){

        message.style.display = "block";
        message.innerHTML =
            "Link này không phải URL YouTube hợp lệ.";

        return;
    }

    /*
      Video chạy ngay trong trang.
      Không chuyển tab.
    */

    player.innerHTML = `
        <iframe
            src="https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0"
            title="YouTube video player"
            allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share
            "
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    `;
}


document
    .getElementById("url")
    .addEventListener("keydown", function(e){

        if(e.key === "Enter"){
            playVideo();
        }

    });

</script>

</body>
</html>
