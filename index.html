<!DOCTYPE html>
<!--
  CARO 5 — xếp hạng online (1 file, chạy trên GitHub Pages)
  SETUP:
  1. console.firebase.google.com → tạo project → Build → Realtime Database (Create) → Authentication → bật "Anonymous".
  2. Project settings → Your apps → Web (</>) → copy config dán vào FIREBASE_CONFIG bên dưới (nhớ có databaseURL).
  3. Realtime Database → Rules → dán:
     {
       "rules": {
         "players": {".read": "auth != null", ".indexOn": ["elo"], "$uid": {".write": "auth.uid === $uid"}},
         "lobby":   {".read": "auth != null", ".write": "auth != null"},
         "invite":  {"$uid": {".read": "auth.uid === $uid", ".write": "auth != null"}},
         "games":   {".read": "auth != null", "$g": {".write": "auth != null"}}
       }
     }
  4. Authentication → Settings → Authorized domains: thêm <tên>.github.io
  5. Push file này lên repo (đặt tên index.html) → Settings → Pages → Deploy from branch.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caro 5 — Đấu xếp hạng</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--desk:#e4e9ec;--paper:#fdfdfa;--blue:#1c3fb7;--red:#d8322b;--ink:#1b2430;--mut:#667381;--ln:#c9d3da}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--desk);color:var(--ink);font:15px/1.45 'Be Vietnam Pro',system-ui,sans-serif;display:flex;justify-content:center}
main{display:grid;grid-template-columns:minmax(0,640px) 280px;gap:24px;width:100%;max-width:960px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.paper{background:var(--paper);padding:10px;border-radius:3px;box-shadow:0 1px 0 #fff inset,0 10px 30px -12px rgba(27,36,48,.45)}
canvas{display:block;width:100%;aspect-ratio:1;cursor:pointer;touch-action:manipulation}
h1{margin:0;font:700 44px/1 Caveat,cursive;color:var(--blue)}h1 b{color:var(--red)}
h2{margin:22px 0 6px;font-size:13px;font-weight:600;color:var(--mut)}
section{border-bottom:1px solid var(--ln);padding-bottom:14px}
input,button{width:100%;font:inherit;padding:10px 12px;border-radius:6px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);margin-top:8px}
button{cursor:pointer;font-weight:600}button.pri{background:var(--ink);color:var(--paper)}
button:disabled{opacity:.4;cursor:not-allowed}button:not(:disabled):active{transform:translateY(1px)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#me{color:var(--mut);font-size:13px}#vs{font:700 22px/1.2 Caveat,cursive}#st{font-weight:600;margin-top:6px}#tm{color:var(--mut);font-size:13px;min-height:1.4em}
.x{color:var(--blue)}.o{color:var(--red)}
ol{margin:0;padding:0;list-style:none;counter-reset:r}
li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--ln);counter-increment:r}
li:before{content:counter(r);color:var(--mut);width:16px}
li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}li i{font-style:normal;color:var(--mut);font-size:12px;align-self:center}
</style>
</head>
<body>
<main>
  <div class="paper"><canvas id="bd" aria-label="Bàn cờ Caro 15x15"></canvas></div>
  <aside>
    <section>
      <h1>Caro <b>5</b></h1>
      <input id="nm" maxlength="14" placeholder="Tên của bạn" autocomplete="off">
      <div id="me"></div>
      <button id="bFind" class="pri" disabled>Đấu xếp hạng</button>
      <button id="bBot">Luyện với máy (không tính điểm)</button>
      <button id="bRes" hidden>Đầu hàng</button>
    </section>
    <section>
      <h2>Ván hiện tại</h2>
      <div id="vs">—</div><div id="st">Chọn chế độ để bắt đầu.</div><div id="tm"></div>
    </section>
    <h2>Bảng xếp hạng</h2>
    <ol id="lb"></ol>
  </aside>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG={apiKey:"",authDomain:"",databaseURL:"",projectId:"",appId:""}; // ← dán config Firebase vào đây
const N=15,TURN=30000,D=[[1,0],[0,1],[1,1],[1,-1]],$=id=>document.getElementById(id);
const TIERS=[[1700,'Cao Thủ'],[1550,'Kim Cương'],[1400,'Bạch Kim'],[1250,'Vàng'],[1100,'Bạc'],[0,'Đồng']];
const tier=e=>TIERS.find(t=>e>=t[0])[1];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const online=!!FIREBASE_CONFIG.apiKey;
let db,off=0,G=null,finding=0,wt=null,ir=null;
let me={uid:null,name:localStorage.caroName||'',elo:1000,w:0,l:0,d:0};
const now=()=>Date.now()+off;
const cv=$('bd'),cx=cv.getContext('2d');
$('nm').value=me.name;

/* ---------- luật & vẽ ---------- */
function win(b,x,y){const p=b[y*N+x];for(const[dx,dy]of D){const L=[[x,y]];for(const s of[1,-1]){let i=x+dx*s,j=y+dy*s;while(i>=0&&j>=0&&i<N&&j<N&&b[j*N+i]===p){L.push([i,j]);i+=dx*s;j+=dy*s}}if(L.length>=5)return L}return null}
const h=(x,y,k)=>{const s=Math.sin(x*12.9898+y*78.233+k*37.7)*43758.5453;return s-Math.floor(s)-.5};
function draw(){
  const css=cv.clientWidth,d=devicePixelRatio||1;cv.width=cv.height=Math.round(css*d);cx.setTransform(d,0,0,d,0,0);
  const c=css/N,P=i=>(i+.5)*c;
  cx.strokeStyle='#9fc3dc';cx.lineWidth=1;cx.beginPath();
  for(let i=0;i<N;i++){cx.moveTo(P(i),0);cx.lineTo(P(i),css);cx.moveTo(0,P(i));cx.lineTo(css,P(i))}cx.stroke();
  if(!G)return;
  if(G.last){cx.fillStyle='rgba(255,214,10,.45)';cx.fillRect(G.last[0]*c,G.last[1]*c,c,c)}
  if(G.line){cx.fillStyle='rgba(216,50,43,.16)';G.line.forEach(([x,y])=>cx.fillRect(x*c,y*c,c,c))}
  cx.lineCap='round';cx.lineWidth=Math.max(2,c*.11);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=G.board[y*N+x];if(v<0)continue;const px=P(x),py=P(y),r=c*.27,j=c*.09;
    cx.beginPath();
    if(v===0){cx.strokeStyle='#1c3fb7';
      cx.moveTo(px-r+h(x,y,1)*j,py-r+h(x,y,2)*j);cx.quadraticCurveTo(px+h(x,y,3)*j,py+h(x,y,4)*j,px+r+h(x,y,5)*j,py+r+h(x,y,6)*j);
      cx.moveTo(px+r+h(x,y,7)*j,py-r+h(x,y,8)*j);cx.quadraticCurveTo(px+h(x,y,9)*j,py+h(x,y,1)*j,px-r+h(x,y,2)*j,py+r+h(x,y,3)*j)}
    else{cx.strokeStyle='#d8322b';cx.ellipse(px,py,r*(1.05+h(x,y,4)*.15),r*(1.05+h(x,y,5)*.15),h(x,y,6)*1.2,0,7)}
    cx.stroke()}
}
function ui(){
  $('me').textContent=me.uid||!online?`${tier(me.elo)} · ${me.elo} ELO · ${me.w}T ${me.l}B ${me.d}H`:'Đang đăng nhập…';
  $('vs').innerHTML=G?`<span class="x">X</span> ${esc(G.names[0])} <small>vs</small> <span class="o">O</span> ${esc(G.names[1])}`:'—';
}
function stat(){
  if(!G){$('st').textContent='Chọn chế độ để bắt đầu.';return}
  $('st').textContent=G.over?G.msg:G.turn===G.mine?`Đến lượt bạn (${G.mine?'O':'X'})`:'Đối thủ đang nghĩ…';
}
function setBusy(b){$('bFind').disabled=b||!me.uid;$('bBot').disabled=b;$('bRes').hidden=!b}

/* ---------- chơi với máy ---------- */
function ev(b,x,y,q){let t=0;for(const[dx,dy]of D){let n=1,o=0;for(const s of[1,-1]){let i=x+dx*s,j=y+dy*s;while(i>=0&&j>=0&&i<N&&j<N&&b[j*N+i]===q){n++;i+=dx*s;j+=dy*s}if(i>=0&&j>=0&&i<N&&j<N&&b[j*N+i]===-1)o++}
  t+=n>=5?1e5:n===4?(o===2?1e4:o?1e3:0):n===3?(o===2?500:o?60:0):n===2?(o===2?40:o?5:0):1}return t}
function near(b,x,y){for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++){const u=x+i,v=y+j;if(u>=0&&v>=0&&u<N&&v<N&&b[v*N+u]>=0)return 1}return 0}
function botMove(b){if(!b.some(v=>v>=0))return[7,7];let best=-1,c=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(b[y*N+x]>=0||!near(b,x,y))continue;const s=ev(b,x,y,1)+ev(b,x,y,0)*.95+Math.random()*3;if(s>best){best=s;c=[x,y]}}return c}
function place(x,y,p){G.board[y*N+x]=p;G.last=[x,y];G.n++;const l=win(G.board,x,y);
  if(l){G.over=1;G.line=l;G.msg=p===0?'Bạn thắng!':'Máy thắng';setBusy(false)}else if(G.n>=N*N){G.over=1;G.msg='Hòa';setBusy(false)}
  draw();stat()}
function bot(){if(!G||G.mode!=='bot'||G.over)return;const[x,y]=botMove(G.board);place(x,y,1);G.turn=0;stat()}
$('bBot').onclick=()=>{if(G&&G.ref)G.ref.off();G={mode:'bot',mine:0,board:Array(N*N).fill(-1),turn:0,n:0,over:0,names:['Bạn','Máy']};setBusy(true);ui();draw();stat();$('tm').textContent=''};

/* ---------- đấu online ---------- */
function play(x,y){
  if(G.mode==='bot'){place(x,y,0);if(!G.over){G.turn=1;stat();setTimeout(bot,350)}return}
  const b=G.board.slice();b[y*N+x]=G.mine;const up={};up['moves/'+G.n]={x,y};
  if(win(b,x,y)){up.status='over';up.winner=G.mine}else if(G.n+1>=N*N){up.status='over';up.winner=-1}else{up.turn=1-G.mine;up.dl=now()+TURN}
  G.turn=-1;G.ref.update(up);
}
cv.onclick=e=>{if(!G||G.over||G.turn!==G.mine)return;const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*N),y=Math.floor((e.clientY-r.top)/r.height*N);
  if(x<0||y<0||x>=N||y>=N||G.board[y*N+x]!==-1)return;play(x,y)};
function openGame(gid){
  if(G&&G.ref)G.ref.off();
  const ref=db.ref('games/'+gid);
  ref.once('value').then(s=>{const v=s.val(),m=v.p[0].uid===me.uid?0:1;
    G={mode:'online',gid,ref,mine:m,board:Array(N*N).fill(-1),turn:0,n:0,over:0,dl:v.dl,names:v.p.map(q=>`${q.name} (${q.elo})`),myElo:v.p[m].elo,opp:v.p[1-m].elo};
    finding=0;$('bFind').textContent='Đấu xếp hạng';setBusy(true);ui();draw();stat();ref.on('value',onGame)});
}
function onGame(s){
  const v=s.val();if(!v||!G||G.gid!==s.key)return;
  const mv=Object.values(v.moves||{}),b=Array(N*N).fill(-1);mv.forEach((m,i)=>b[m.y*N+m.x]=i%2);
  const lm=mv[mv.length-1];
  Object.assign(G,{board:b,n:mv.length,turn:v.turn,dl:v.dl,last:lm?[lm.x,lm.y]:null,claim:0});
  if(v.status==='over'&&!G.over){G.over=1;G.winner=v.winner;G.line=lm&&v.winner>=0?win(b,lm.x,lm.y):null;finish(v.why)}
  draw();stat();
}
function finish(why){
  const w=G.winner,m=G.mine,sc=w===-1?.5:w===m?1:0;
  const ne=Math.max(0,Math.round(G.myElo+32*(sc-1/(1+10**((G.opp-G.myElo)/400))))),dl=ne-G.myElo;
  G.msg=(sc===.5?'Hòa':sc?'Bạn thắng!':'Bạn thua')+(why==='timeout'?' (hết giờ)':why==='resign'?' (đầu hàng)':'')+` · ${dl>=0?'+':''}${dl} ELO`;
  setBusy(false);$('tm').textContent='';
  db.ref('players/'+me.uid).transaction(c=>c?{...c,elo:ne,w:(c.w||0)+(sc===1?1:0),l:(c.l||0)+(sc===0?1:0),d:(c.d||0)+(sc===.5?1:0)}:c);
}
$('bRes').onclick=()=>{if(!G||G.over)return;if(G.mode==='bot'){G.over=1;G.msg='Bạn đã đầu hàng';setBusy(false);stat()}else G.ref.update({status:'over',winner:1-G.mine,why:'resign'})};
setInterval(()=>{ // đồng hồ + xử thua khi hết giờ
  if(!G||G.mode!=='online'||G.over||!G.dl)return;
  const s=Math.max(0,Math.ceil((G.dl-now())/1000));$('tm').textContent=`${G.turn===G.mine?'Bạn':'Đối thủ'} còn ${s}s`;
  if(G.claim)return;
  if(G.turn===G.mine&&now()>G.dl+1500){G.claim=1;G.ref.update({status:'over',winner:1-G.mine,why:'timeout'})}
  else if(G.turn===1-G.mine&&now()>G.dl+5000){G.claim=1;G.ref.update({status:'over',winner:G.mine,why:'timeout'})}
},500);

/* ---------- ghép trận ---------- */
async function cancelFind(){
  clearTimeout(wt);if(ir){ir.off();ir=null}
  await db.ref('lobby').transaction(c=>c&&c.uid===me.uid?null:undefined);
  finding=0;$('bFind').textContent='Đấu xếp hạng';$('bBot').disabled=false;$('st').textContent='Đã huỷ tìm trận.';
}
$('bFind').onclick=async()=>{
  if(finding)return cancelFind();
  const nm=$('nm').value.trim();if(!nm){$('st').textContent='Nhập tên trước khi vào trận.';$('nm').focus();return}
  me.name=nm;localStorage.caroName=nm;finding=1;$('bFind').textContent='Huỷ tìm trận';$('bBot').disabled=true;$('st').textContent='Đang tìm đối thủ…';
  await db.ref('players/'+me.uid).transaction(c=>c?{...c,name:nm}:{name:nm,elo:1000,w:0,l:0,d:0});
  await db.ref('invite/'+me.uid).remove();
  let opp=null;const lobby=db.ref('lobby');
  await lobby.transaction(c=>{opp=null;if(c&&c.uid!==me.uid&&now()-c.t<50000){opp=c;return null}return{uid:me.uid,name:me.name,elo:me.elo,t:now()}});
  if(!finding){return}
  if(opp){
    const gid=db.ref('games').push().key,pl=[{uid:me.uid,name:me.name,elo:me.elo},{uid:opp.uid,name:opp.name,elo:opp.elo}];
    if(Math.random()<.5)pl.reverse();
    await db.ref('games/'+gid).set({p:pl,turn:0,status:'play',dl:now()+TURN+5000});
    await db.ref('invite/'+opp.uid).set(gid);openGame(gid);
  }else{
    lobby.onDisconnect().remove();ir=db.ref('invite/'+me.uid);
    ir.on('value',s=>{if(!s.val())return;const gid=s.val();ir.off();ir=null;ir=null;clearTimeout(wt);lobby.onDisconnect().cancel();db.ref('invite/'+me.uid).remove();openGame(gid)});
    wt=setTimeout(()=>{cancelFind();$('st').textContent='Chưa có đối thủ, thử lại sau nhé.'},45000);
  }
};

/* ---------- khởi động ---------- */
if(online){
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();
  db.ref('.info/serverTimeOffset').on('value',s=>off=s.val()||0);
  firebase.auth().signInAnonymously().then(u=>{
    me.uid=u.user.uid;$('bFind').disabled=!!G;
    db.ref('players/'+me.uid).on('value',s=>{if(s.val()){const{name,...r}=s.val();Object.assign(me,r)}ui()});
    db.ref('players').orderByChild('elo').limitToLast(10).on('value',s=>{const a=[];s.forEach(c=>{a.push(c.val())});
      $('lb').innerHTML=a.reverse().map(p=>`<li><span>${esc(p.name)}</span><i>${tier(p.elo)}</i><b>${p.elo}</b></li>`).join('')});
  }).catch(e=>$('st').textContent='Không đăng nhập được: '+e.message);
}else $('st').textContent='Chưa cấu hình Firebase — hiện chỉ chơi được với máy.';
addEventListener('resize',draw);ui();draw();
</script>
</body>
</html>
