<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Video Viewer</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#202633 0,#0b0e13 45%,#07090d 100%);
    color:#fff;
}

.container{
    width:min(1000px,94%);
    margin:40px auto;
}

.card{
    background:rgba(20,24,32,.95);
    border:1px solid #2d3440;
    border-radius:24px;
    padding:25px;
    box-shadow:0 25px 70px #0008;
}

h1{
    text-align:center;
    margin:0;
    font-size:32px;
}

.subtitle{
    text-align:center;
    color:#9ea7b5;
    margin:10px 0 25px;
}

.row{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    min-width:0;
    height:52px;
    padding:0 16px;
    border-radius:14px;
    border:1px solid #39414e;
    background:#0b0f15;
    color:#fff;
    outline:none;
    font-size:16px;
}

input:focus{
    border-color:#ff1744;
}

button{
    height:52px;
    padding:0 22px;
    border:0;
    border-radius:14px;
    background:#ff1744;
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    filter:brightness(1.08);
}

#player{
    margin-top:20px;
}

.player-box{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:18px;
    overflow:hidden;
}

.player-box iframe,
.player-box video{
    width:100%;
    height:100%;
    display:block;
    border:0;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.action{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:48px;
    padding:12px;
    border-radius:12px;
    text-decoration:none;
    color:#fff;
    background:#171d26;
    border:1px solid #2d3540;
    cursor:pointer;
    font-weight:700;
}

.green{
    background:#159447;
    border-color:#159447;

    margin-top:15px;

    background:#0d1117;

    .actions{

</head>

<body>

<div class="container">

<div class="card">

<h1>🎬 Video Viewer</h1>

<div class="subtitle">
Xem video ngay trên trang • tải file video trực tiếp
</div>

<div class="row">

<input
    id="url"
    type="text"
    autocomplete="off"
    placeholder="Dán link YouTube hoặc link .mp4/.webm..."
>

<button onclick="openVideo()">
    MỞ VIDEO
</button>

</div>

<div id="player"></div>

<div id="info" class="info hidden"></div>

</div>

</div>


<script>

const urlInput = document.getElementById("url");
const player = document.getElementById("player");
const info = document.getElementById("info");


function showInfo(text){
    info.classList.remove("hidden");
    info.innerHTML = text;
}


function hideInfo(){
    info.classList.add("hidden");
    info.innerHTML = "";
}


function getYouTubeId(url){

    try{

        const u = new URL(url);

        // youtube.com/watch?v=ID
        if(
            u.hostname === "youtube.com" ||
            u.hostname === "www.youtube.com"
        ){

            const v = u.searchParams.get("v");

            if(v) return v;

            // youtube.com/shorts/ID
            if(u.pathname.startsWith("/shorts/")){
                return u.pathname
                    .split("/shorts/")[1]
                    .split("/")[0];
            }

            // youtube.com/live/ID
            if(u.pathname.startsWith("/live/")){
                return u.pathname
                    .split("/live/")[1]
                    .split("/")[0];
            }

            // youtube.com/embed/ID
            if(u.pathname.startsWith("/embed/")){
                return u.pathname
                    .split("/embed/")[1]
                    .split("/")[0];
            }
        }

        // youtu.be/ID
        if(
            u.hostname === "youtu.be" ||
            u.hostname === "www.youtu.be"
        ){
            return u.pathname.substring(1).split("/")[0];
        }

    }catch(e){}

    return null;
}


function isDirectVideo(url){

    return /\.(mp4|webm|ogg|m4v|mov)(\?.*)?$/i.test(url);

}


function safe(text){

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function openVideo(){

    const url = urlInput.value.trim();

    player.innerHTML = "";
    hideInfo();

    if(!url){

        showInfo("Hãy dán link video.");
        return;
    }


    /*
    ===========================
    YOUTUBE
    ===========================
    */

    const youtubeId = getYouTubeId(url);

    if(youtubeId){

        player.innerHTML = `
            <div class="player-box">
                <iframe
                    src="https://www.youtube.com/embed/${encodeURIComponent(youtubeId)}"
                    title="YouTube video"
                    allow="
                        accelerometer;
                        autoplay;
                        clipboard-write;
                        encrypted-media;
                        gyroscope;
                        picture-in-picture;
                        web-share
                    "
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            </div>
        `;

        showInfo(
            "Video YouTube đang được phát trong trang. " +
            "Việc phát phụ thuộc vào quyền xem và việc chủ video cho phép nhúng."
        );

        return;
    }


    /*
    ===========================
    VIDEO FILE TRỰC TIẾP
    ===========================
    */

    if(isDirectVideo(url)){

        const encodedUrl =
            encodeURI(url);

        player.innerHTML = `
            <div class="player-box">
                <video
                    controls
                    autoplay
                    playsinline
                    preload="metadata">
                    <source src="${safe(encodedUrl)}">
                    Trình duyệt không hỗ trợ video này.
                </video>
            </div>

            <div class="actions">

                <a
                    class="action green"
                    href="${safe(encodedUrl)}"
                    download>
                    ⬇ TẢI VIDEO
                </a>

                <button
                    class="action"
                    onclick="openDirect()">
                    ↗ MỞ LINK
                </button>

            </div>
        `;

        showInfo(
            "Đây là URL file video trực tiếp. " +
            "Nút TẢI VIDEO sử dụng chính URL do máy chủ cung cấp."
        );

        window.currentDirectUrl = url;

        return;
    }


    /*
    ===========================
    URL KHÁC
    ===========================
    */

    showInfo(
        "Không nhận diện được URL. " +
        "Hãy dùng link YouTube hoặc URL file video trực tiếp " +
        "như .mp4, .webm, .ogg, .m4v."
    );

}


function openDirect(){

    if(window.currentDirectUrl){
        window.open(
            window.currentDirectUrl,
            "_blank",
            "noopener"
        );
    }

}


urlInput.addEventListener("keydown",function(e){

    if(e.key === "Enter"){
        openVideo();
    }

});

</script>

</body>
</html>
