<!DOCTYPE html>
<!--
  CARO 5 — xếp hạng online (1 file, chạy trên GitHub Pages)
  SETUP:
  1. console.firebase.google.com → tạo project → Build → Realtime Database (Create) → Authentication → bật "Anonymous".
  2. Project settings → Your apps → Web (</>) → copy config dán vào FIREBASE_CONFIG bên dưới (nhớ có databaseURL).
  3. Realtime Database → Rules → dán:
     {
       "rules": {
         "players": {".read": "auth != null", ".indexOn": ["elo"], "$uid": {"name": {".write": "auth.uid === $uid && !data.exists()"}, "elo": {".write": "auth.uid === $uid"}, "w": {".write": "auth.uid === $uid"}, "l": {".write": "auth.uid === $uid"}, "d": {".write": "auth.uid === $uid"}}},
         "lobby":   {".read": "auth != null", ".write": "auth != null"},
         "invite":  {"$uid": {".read": "auth.uid === $uid", ".write": "auth != null"}},
         "games":   {".read": "auth != null", "$g": {".write": "auth != null"}}
       }
     }
  4. Authentication → Settings → Authorized domains: thêm <tên>.github.io
  5. Push file này lên repo (đặt tên index.html) → Settings → Pages → Deploy from branch.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caro 5 — Đấu xếp hạng</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--desk:#e4e9ec;--paper:#fdfdfa;--blue:#1c3fb7;--red:#d8322b;--ink:#1b2430;--mut:#667381;--ln:#c9d3da}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--desk);color:var(--ink);font:15px/1.45 'Be Vietnam Pro',system-ui,sans-serif;display:flex;justify-content:center}
main{display:grid;grid-template-columns:minmax(0,640px) 280px;gap:24px;width:100%;max-width:960px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.paper{background:var(--paper);padding:10px;border-radius:3px;box-shadow:0 1px 0 #fff inset,0 10px 30px -12px rgba(27,36,48,.45)}
canvas{display:block;width:100%;aspect-ratio:1;cursor:crosshair;touch-action:none}
h1{margin:0;font:700 44px/1 Caveat,cursive;color:var(--blue)}h1 b{color:var(--red)}
h2{margin:22px 0 6px;font-size:13px;font-weight:600;color:var(--mut)}
section{border-bottom:1px solid var(--ln);padding-bottom:14px}
input,button{width:100%;font:inherit;padding:10px 12px;border-radius:6px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);margin-top:8px}
button{cursor:pointer;font-weight:600}button.pri{background:var(--ink);color:var(--paper)}
button:disabled{opacity:.4;cursor:not-allowed}button:not(:disabled):active{transform:translateY(1px)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#me{color:var(--mut);font-size:13px}#vs{font:700 22px/1.2 Caveat,cursive}#st{font-weight:600;margin-top:6px}#tm{color:var(--mut);font-size:13px;min-height:1.4em}
.x{color:var(--blue)}.o{color:var(--red)}
ol{margin:0;padding:0;list-style:none;counter-reset:r}
li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--ln);counter-increment:r}
li:before{content:counter(r);color:var(--mut);width:16px}
li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}li i{font-style:normal;color:var(--mut);font-size:12px;align-self:center}
#ov{position:fixed;inset:0;background:rgba(228,233,236,.94);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}#ov[hidden]{display:none}
#ov>div{background:var(--paper);padding:24px;border-radius:3px;max-width:340px;width:100%;box-shadow:0 10px 30px -12px rgba(27,36,48,.45)}
#ov p{margin:8px 0 0;color:var(--mut);font-size:13px}#nmEr{color:var(--red);font-size:13px;min-height:1.4em;margin-top:6px}#me{font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<div id="ov" hidden><div><h1>Caro <b>5</b></h1><p>Đặt tên người chơi. Tên chỉ đặt một lần và không thể đổi về sau.</p><input id="nm" maxlength="14" placeholder="Tên của bạn" autocomplete="off"><div id="nmEr"></div><button id="nmOk" class="pri">Vào chơi</button></div></div>
<main>
  <div class="paper"><canvas id="bd" aria-label="Bàn cờ Caro vô hạn"></canvas></div>
  <aside>
    <section>
      <h1>Caro <b>5</b></h1>
      <div id="me"></div>
      <button id="bFind" class="pri" disabled>Đấu xếp hạng</button>
      <button id="bBot">Luyện với máy (không tính điểm)</button>
      <button id="bRes" hidden>Đầu hàng</button>
      <button id="bCen">Về nước vừa đánh</button>
    </section>
    <section>
      <h2>Ván hiện tại</h2>
      <div id="vs">—</div><div id="st">Chọn chế độ để bắt đầu.</div><div id="tm"></div>
    </section>
    <h2>Bảng xếp hạng</h2>
    <ol id="lb"></ol>
  </aside>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG={apiKey:"",authDomain:"",databaseURL:"",projectId:"",appId:""}; // ← dán config Firebase vào đây
const N=15,TURN=30000,D=[[1,0],[0,1],[1,1],[1,-1]],$=id=>document.getElementById(id);
const TIERS=[[1700,'Cao Thủ'],[1550,'Kim Cương'],[1400,'Bạch Kim'],[1250,'Vàng'],[1100,'Bạc'],[0,'Đồng']];
const tier=e=>TIERS.find(t=>e>=t[0])[1];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const online=!!FIREBASE_CONFIG.apiKey;
let db,off=0,G=null,finding=0,wt=null,ir=null;
let me={uid:null,name:localStorage.caroName||'',elo:1000,w:0,l:0,d:0};
const now=()=>Date.now()+off;
const cv=$('bd'),cx=cv.getContext('2d');

/* ---------- luật & vẽ (bàn vô hạn: kéo để di chuyển, cuộn/chụm để zoom) ---------- */
function win(b,x,y){const p=b.get(x+','+y);for(const[dx,dy]of D){const L=[[x,y]];for(const s of[1,-1]){let i=x+dx*s,j=y+dy*s;while(b.get(i+','+j)===p){L.push([i,j]);i+=dx*s;j+=dy*s}}if(L.length>=5)return L}return null}
const h=(x,y,k)=>{const s=Math.sin(x*12.9898+y*78.233+k*37.7)*43758.5453;return s-Math.floor(s)-.5};
const cam={x:.5,y:.5,s:36};
function draw(){
  const W=cv.clientWidth,H=cv.clientHeight,d=devicePixelRatio||1;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0);
  const c=cam.s,ox=W/2-cam.x*c,oy=H/2-cam.y*c,i0=Math.floor(cam.x-W/2/c),i1=Math.ceil(cam.x+W/2/c),j0=Math.floor(cam.y-H/2/c),j1=Math.ceil(cam.y+H/2/c);
  cx.strokeStyle='#9fc3dc';cx.lineWidth=1;cx.beginPath();
  for(let i=i0;i<=i1;i++){const X=Math.round(ox+i*c)+.5;cx.moveTo(X,0);cx.lineTo(X,H)}
  for(let j=j0;j<=j1;j++){const Y=Math.round(oy+j*c)+.5;cx.moveTo(0,Y);cx.lineTo(W,Y)}cx.stroke();
  if(!G)return;
  const cell=(x,y,f)=>{cx.fillStyle=f;cx.fillRect(ox+x*c+1,oy+y*c+1,c-1,c-1)};
  if(G.last)cell(G.last[0],G.last[1],'rgba(255,214,10,.45)');
  if(G.line)G.line.forEach(([x,y])=>cell(x,y,'rgba(216,50,43,.16)'));
  cx.lineCap='round';cx.lineWidth=Math.max(2,c*.1);
  G.board.forEach((v,k)=>{const[x,y]=k.split(',').map(Number);if(x<i0||x>i1||y<j0||y>j1)return;
    const px=ox+(x+.5)*c,py=oy+(y+.5)*c,r=c*.3,q=c*.07;cx.beginPath();
    if(v===0){cx.strokeStyle='#1c3fb7';
      cx.moveTo(px-r+h(x,y,1)*q,py-r+h(x,y,2)*q);cx.quadraticCurveTo(px+h(x,y,3)*q,py+h(x,y,4)*q,px+r+h(x,y,5)*q,py+r+h(x,y,6)*q);
      cx.moveTo(px+r+h(x,y,7)*q,py-r+h(x,y,8)*q);cx.quadraticCurveTo(px+h(x,y,9)*q,py+h(x,y,1)*q,px-r+h(x,y,2)*q,py+r+h(x,y,3)*q)}
    else{cx.strokeStyle='#d8322b';cx.ellipse(px,py,r*(1+h(x,y,4)*.12),r*(1+h(x,y,5)*.12),h(x,y,6)*1.2,0,7)}
    cx.stroke()});
}
function ui(){
  $('me').textContent=me.uid||!online?`${me.name} · ${tier(me.elo)} · ${me.elo} ELO · ${me.w}T ${me.l}B ${me.d}H`:'Đang đăng nhập…';
  $('vs').innerHTML=G?`<span class="x">X</span> ${esc(G.names[0])} <small>vs</small> <span class="o">O</span> ${esc(G.names[1])}`:'—';
}
function stat(){
  if(!G){$('st').textContent='Chọn chế độ để bắt đầu.';return}
  $('st').textContent=G.over?G.msg:G.turn===G.mine?`Đến lượt bạn (${G.mine?'O':'X'})`:'Đối thủ đang nghĩ…';
}
function setBusy(b){$('bFind').disabled=b||!me.uid;$('bBot').disabled=b;$('bRes').hidden=!b}

/* ---------- chơi với máy ---------- */
function ev(b,x,y,q){let t=0;for(const[dx,dy]of D){let n=1,o=0;for(const s of[1,-1]){let i=x+dx*s,j=y+dy*s;while(b.get(i+','+j)===q){n++;i+=dx*s;j+=dy*s}if(!b.has(i+','+j))o++}
  t+=n>=5?1e5:n===4?(o===2?1e4:o?1e3:0):n===3?(o===2?500:o?60:0):n===2?(o===2?40:o?5:0):1}return t}
function botMove(b){if(!b.size)return[0,0];const c=new Set();
  b.forEach((v,k)=>{const[x,y]=k.split(',').map(Number);for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++){const q=(x+i)+','+(y+j);if(!b.has(q))c.add(q)}});
  let best=-1,r=[0,0];c.forEach(k=>{const[x,y]=k.split(',').map(Number),s=ev(b,x,y,1)+ev(b,x,y,0)*.95+Math.random()*3;if(s>best){best=s;r=[x,y]}});return r}
function place(x,y,p){G.board.set(x+','+y,p);G.last=[x,y];G.n++;const l=win(G.board,x,y);
  if(l){G.over=1;G.line=l;G.msg=p===0?'Bạn thắng!':'Máy thắng';setBusy(false)}draw();stat()}
function bot(){if(!G||G.mode!=='bot'||G.over)return;const[x,y]=botMove(G.board);place(x,y,1);G.turn=0;stat()}
$('bBot').onclick=()=>{if(G&&G.ref)G.ref.off();G={mode:'bot',mine:0,board:new Map(),turn:0,n:0,over:0,names:['Bạn','Máy']};cam.x=cam.y=.5;setBusy(true);ui();draw();stat();$('tm').textContent=''};

/* ---------- đấu online ---------- */
function play(x,y){
  if(G.mode==='bot'){place(x,y,0);if(!G.over){G.turn=1;stat();setTimeout(bot,350)}return}
  const b=new Map(G.board);b.set(x+','+y,G.mine);const up={};up['moves/'+G.n]={x,y};
  if(win(b,x,y)){up.status='over';up.winner=G.mine}else{up.turn=1-G.mine;up.dl=now()+TURN}
  G.turn=-1;G.ref.update(up);
}
const ptr=new Map();let moved=0,pinch=0;
const dist=()=>{const[a,b]=[...ptr.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])};
function zoomAt(px,py,f){const r=cv.getBoundingClientRect(),W=r.width,H=r.height,c=cam.s,wx=cam.x+(px-W/2)/c,wy=cam.y+(py-H/2)/c;
  cam.s=Math.min(90,Math.max(12,c*f));cam.x=wx-(px-W/2)/cam.s;cam.y=wy-(py-H/2)/cam.s;draw()}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;if(ptr.size===2)pinch=dist()};
cv.onpointermove=e=>{if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId),dx=e.clientX-p[0],dy=e.clientY-p[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size===2){const d=dist(),r=cv.getBoundingClientRect(),[a,b]=[...ptr.values()];zoomAt((a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,d/pinch);pinch=d;moved=99;return}
  moved+=Math.abs(dx)+Math.abs(dy);if(moved>8){cam.x-=dx/cam.s;cam.y-=dy/cam.s;draw()}};
cv.onpointerup=e=>{const one=ptr.size===1;ptr.delete(e.pointerId);if(!one||moved>8||!G||G.over||G.turn!==G.mine)return;
  const r=cv.getBoundingClientRect(),x=Math.floor(cam.x+(e.clientX-r.left-r.width/2)/cam.s),y=Math.floor(cam.y+(e.clientY-r.top-r.height/2)/cam.s);
  if(!G.board.has(x+','+y))play(x,y)};
cv.onpointercancel=e=>ptr.delete(e.pointerId);
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:.89)},{passive:false});
$('bCen').onclick=()=>{const l=G&&G.last;cam.x=l?l[0]+.5:.5;cam.y=l?l[1]+.5:.5;draw()};
const ov=$('ov'),showOv=()=>{ov.hidden=false;$('nm').focus()},hideOv=()=>{ov.hidden=true};
$('nmOk').onclick=async()=>{const n=$('nm').value.trim().replace(/\s+/g,' ');
  if(n.length<2){$('nmEr').textContent='Tên cần từ 2 đến 14 ký tự.';return}
  if(!online){localStorage.caroName=n;me.name=n;hideOv();ui();return}
  try{await db.ref('players/'+me.uid).update({name:n,elo:1000,w:0,l:0,d:0})}catch(e){$('nmEr').textContent='Không lưu được tên: '+e.message}};
$('nm').onkeydown=e=>{if(e.key==='Enter')$('nmOk').click()};
function openGame(gid){
  if(G&&G.ref)G.ref.off();
  const ref=db.ref('games/'+gid);
  ref.once('value').then(s=>{const v=s.val(),m=v.p[0].uid===me.uid?0:1;
    G={mode:'online',gid,ref,mine:m,board:new Map(),turn:0,n:0,over:0,dl:v.dl,names:v.p.map(q=>`${q.name} (${q.elo})`),myElo:v.p[m].elo,opp:v.p[1-m].elo};
    finding=0;$('bFind').textContent='Đấu xếp hạng';setBusy(true);ui();draw();stat();cam.x=cam.y=.5;ref.on('value',onGame)});
}
function onGame(s){
  const v=s.val();if(!v||!G||G.gid!==s.key)return;
  const mv=Object.values(v.moves||{}),b=new Map();mv.forEach((m,i)=>b.set(m.x+','+m.y,i%2));
  const lm=mv[mv.length-1];
  Object.assign(G,{board:b,n:mv.length,turn:v.turn,dl:v.dl,last:lm?[lm.x,lm.y]:null,claim:0});
  if(v.status==='over'&&!G.over){G.over=1;G.winner=v.winner;G.line=lm&&v.winner>=0?win(b,lm.x,lm.y):null;finish(v.why)}
  draw();stat();
}
function finish(why){
  const w=G.winner,m=G.mine,sc=w===-1?.5:w===m?1:0;
  const ne=Math.max(0,Math.round(G.myElo+32*(sc-1/(1+10**((G.opp-G.myElo)/400))))),dl=ne-G.myElo;
  G.msg=(sc===.5?'Hòa':sc?'Bạn thắng!':'Bạn thua')+(why==='timeout'?' (hết giờ)':why==='resign'?' (đầu hàng)':'')+` · ${dl>=0?'+':''}${dl} ELO`;
  setBusy(false);$('tm').textContent='';
  db.ref('players/'+me.uid).update({elo:ne,w:me.w+(sc===1?1:0),l:me.l+(sc===0?1:0),d:me.d+(sc===.5?1:0)});
}
$('bRes').onclick=()=>{if(!G||G.over)return;if(G.mode==='bot'){G.over=1;G.msg='Bạn đã đầu hàng';setBusy(false);stat()}else G.ref.update({status:'over',winner:1-G.mine,why:'resign'})};
setInterval(()=>{ // đồng hồ + xử thua khi hết giờ
  if(!G||G.mode!=='online'||G.over||!G.dl)return;
  const s=Math.max(0,Math.ceil((G.dl-now())/1000));$('tm').textContent=`${G.turn===G.mine?'Bạn':'Đối thủ'} còn ${s}s`;
  if(G.claim)return;
  if(G.turn===G.mine&&now()>G.dl+1500){G.claim=1;G.ref.update({status:'over',winner:1-G.mine,why:'timeout'})}
  else if(G.turn===1-G.mine&&now()>G.dl+5000){G.claim=1;G.ref.update({status:'over',winner:G.mine,why:'timeout'})}
},500);

/* ---------- ghép trận ---------- */
async function cancelFind(){
  clearTimeout(wt);if(ir){ir.off();ir=null}
  await db.ref('lobby').transaction(c=>c&&c.uid===me.uid?null:undefined);
  finding=0;$('bFind').textContent='Đấu xếp hạng';$('bBot').disabled=false;$('st').textContent='Đã huỷ tìm trận.';
}
$('bFind').onclick=async()=>{
  if(finding)return cancelFind();
  finding=1;$('bFind').textContent='Huỷ tìm trận';$('bBot').disabled=true;$('st').textContent='Đang tìm đối thủ…';
  await db.ref('invite/'+me.uid).remove();
  let opp=null;const lobby=db.ref('lobby');
  await lobby.transaction(c=>{opp=null;if(c&&c.uid!==me.uid&&now()-c.t<50000){opp=c;return null}return{uid:me.uid,name:me.name,elo:me.elo,t:now()}});
  if(!finding){return}
  if(opp){
    const gid=db.ref('games').push().key,pl=[{uid:me.uid,name:me.name,elo:me.elo},{uid:opp.uid,name:opp.name,elo:opp.elo}];
    if(Math.random()<.5)pl.reverse();
    await db.ref('games/'+gid).set({p:pl,turn:0,status:'play',dl:now()+TURN+5000});
    await db.ref('invite/'+opp.uid).set(gid);openGame(gid);
  }else{
    lobby.onDisconnect().remove();ir=db.ref('invite/'+me.uid);
    ir.on('value',s=>{if(!s.val())return;const gid=s.val();ir.off();ir=null;ir=null;clearTimeout(wt);lobby.onDisconnect().cancel();db.ref('invite/'+me.uid).remove();openGame(gid)});
    wt=setTimeout(()=>{cancelFind();$('st').textContent='Chưa có đối thủ, thử lại sau nhé.'},45000);
  }
};

/* ---------- khởi động ---------- */
if(online){
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();
  db.ref('.info/serverTimeOffset').on('value',s=>off=s.val()||0);
  firebase.auth().signInAnonymously().then(u=>{
    me.uid=u.user.uid;$('bFind').disabled=!!G;
    db.ref('players/'+me.uid).on('value',s=>{if(s.val()){Object.assign(me,s.val());hideOv()}else showOv();ui()});
    db.ref('players').orderByChild('elo').limitToLast(10).on('value',s=>{const a=[];s.forEach(c=>{a.push(c.val())});
      $('lb').innerHTML=a.reverse().map(p=>`<li><span>${esc(p.name)}</span><i>${tier(p.elo)}</i><b>${p.elo}</b></li>`).join('')});
  }).catch(e=>$('st').textContent='Không đăng nhập được: '+e.message);
}else $('st').textContent='Chưa cấu hình Firebase — hiện chỉ chơi được với máy.';
if(!online&&!me.name)showOv();addEventListener('resize',draw);ui();draw();
</script>
</body>
</html>
